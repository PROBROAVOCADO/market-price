<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="酪梨行情">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>波波酪梨 · 酪梨行情</title>
<style>
:root{
  --paper:#FFFFFF; --cream:#F7F4EE; --ink:#3E3226; --muted:#8A7C6C;
  --line:#E4DED2; --wash:#F4F1E9;
  --leaf:#6F9A46; --leaf-dark:#5A7F38; --bark:#6B563C;
  --alert:#B3261E; --alert-bg:#FBEDEA; --done:#B0A695;
  --up:#B3261E; --down:#4A7A3C;
  --tap:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
  color:var(--ink); background:var(--cream);
  font-size:17px; line-height:1.45; overscroll-behavior:none;
}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--cream);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 9px;
  margin:0 -16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;
}
.topbar h1{font-size:18px;font-weight:800;margin:0;letter-spacing:.04em}
.stamp{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
.stamp.stale{color:var(--alert);font-weight:700}

nav#tabs{
  flex:none;display:flex;border-top:1px solid var(--line);background:var(--paper);
  padding-bottom:env(safe-area-inset-bottom);
}
nav#tabs button{
  flex:1;padding:7px 0 5px;font-size:11px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
}
nav#tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
nav#tabs button[aria-current="true"]{color:var(--leaf);font-weight:700}

.btn{
  min-height:var(--tap);padding:0 18px;border-radius:14px;
  background:var(--leaf);color:#fff;font-weight:700;font-size:16.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{background:var(--leaf-dark)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:active{background:var(--wash)}
.btn.wide{width:100%}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px;border-radius:11px}
.btn[disabled]{opacity:.45}

.notice{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14.5px;
  background:var(--alert-bg);border:1px solid #EDCFC9;color:#8A2119;font-weight:600}
.notice.calm{background:var(--wash);border-color:var(--line);color:var(--muted);
  font-weight:400;white-space:pre-line}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:15px}

.chips{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:19px;white-space:nowrap;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}

.secTitle{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.12em;
  margin:20px 2px 8px}
.chartBox{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:10px 8px 8px;margin-bottom:6px}
.chartBox svg{display:block;width:100%;height:auto;touch-action:pan-y}
#scrub{cursor:ew-resize}
.readout{border-top:1px solid var(--line);margin:6px 6px 0;padding-top:8px}
.roDate{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.04em;
  display:flex;align-items:baseline}
.roUnit{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.roVals{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;
  font-size:13px;color:var(--muted);font-weight:600}
.roVals b{color:var(--ink);font-weight:800;font-size:14.5px}
.roVals .off b{color:var(--done);font-weight:600;font-size:13px}
.roVals i{display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:5px;vertical-align:baseline}
.hintLine{font-size:11.5px;color:var(--done);margin:7px 6px 0;text-align:center}

/* 市場卡 */
.mk{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:9px}
.mkHead{display:flex;align-items:baseline;gap:8px}
.mkName{font-size:19px;font-weight:800;letter-spacing:.04em}
.mkDate{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.mkAvg{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.mkAvg b{font-size:30px;font-weight:800;letter-spacing:-.01em}
.mkAvg .u{font-size:13px;color:var(--muted);font-weight:600}
.mkAvg .qty{margin-left:auto;font-size:13.5px;color:var(--muted);font-weight:600}
.delta{font-size:13px;font-weight:800;padding:1px 7px;border-radius:8px;background:var(--wash)}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}

/* 價格帶：這支 App 的核心視覺 */
.band{margin-top:11px}
.bandWrap{position:relative;padding-top:13px}
.bandBar{position:relative;height:26px;border-radius:8px;background:var(--wash);
  border:1px solid var(--line);overflow:hidden}
.bandFill{position:absolute;top:0;bottom:0;left:0;right:0;opacity:.20}
.bandMid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.bandAvg{position:absolute;top:0;width:0;height:0;margin-left:-7px;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:11px solid currentColor}
.bandTicks{display:flex;justify-content:space-between;margin-top:5px;
  font-size:12px;color:var(--muted);font-weight:700}
.bandTicks span{font-variant-numeric:tabular-nums}
.bandKey{margin-top:6px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.bandKey b{color:var(--ink);font-weight:700}

/* 符號說明 */
.bandLegend{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:9px 13px;margin-bottom:10px;font-size:12.5px;color:var(--muted);line-height:1.9}
.blRow{display:flex;align-items:center;gap:9px}
.blBar{flex:none;width:34px;height:13px;border-radius:4px;
  background:var(--wash);border:1px solid var(--line)}
.blSym{flex:none;width:34px;text-align:center;position:relative;height:13px}
.blTri{position:absolute;left:50%;top:1px;margin-left:-6px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:9px solid var(--leaf)}
.blLine{position:absolute;left:50%;top:0;margin-left:-1px;width:2px;height:13px;
  background:var(--ink);opacity:.6}

/* 明細 */
.dayBlock{margin-bottom:14px}
.dayHead{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;
  margin:0 2px 6px;display:flex}
.dayHead .w{margin-left:auto;font-weight:600}
.dRow{display:flex;align-items:center;gap:8px;background:var(--paper);
  border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:11px;padding:8px 11px;margin-bottom:5px}
.dName{flex:none;width:52px;font-size:14px;font-weight:700}
.dNums{flex:1;display:flex;gap:9px;font-size:13.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.dNums b{color:var(--ink);font-weight:800}
.dQty{flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 設定 */
.setRow{background:var(--paper);border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;margin-bottom:9px}
.setRow h3{margin:0 0 4px;font-size:15px;font-weight:800}
.setRow p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.setRow p b{color:var(--ink)}


/* 作物切換鈕 */
.cropBtn{display:inline-flex;align-items:center;gap:4px;
  min-height:30px;padding:0 11px;border-radius:15px;
  background:var(--leaf);color:#fff;font-size:14px;font-weight:700;letter-spacing:.03em}
.cropBtn:active{background:var(--leaf-dark)}
.cropBtn .caret{font-size:10px;opacity:.85}

.chips.wrap{flex-wrap:wrap;overflow:visible;margin-bottom:12px;row-gap:7px}

/* 底部選單 */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(62,50,38,.5);
  display:flex;align-items:flex-end}
.sheetBody{background:var(--cream);width:100%;border-radius:20px 20px 0 0;
  padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:86%;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheetBody h2{margin:0 0 3px;font-size:19px}
.sheetBody p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.field{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);margin-bottom:10px}
.field:focus{outline:2px solid var(--leaf);outline-offset:-1px}

.cropList{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.cropItem{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
  padding:11px 13px;border-bottom:1px solid var(--wash)}
.cropItem:last-child{border-bottom:0}
.cropItem:active{background:var(--wash)}
.cropItem b{font-size:16px;font-weight:700}
.cropItem span{margin-left:auto;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.cropItem.on{background:var(--wash)}
.cropItem.on b{color:var(--leaf)}

.setRow.disclaimer{background:var(--wash);border-color:var(--line)}
.setRow.disclaimer h3{color:var(--bark)}

#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;
  font-size:15px;font-weight:600;z-index:90;opacity:0;transition:opacity .18s;
  pointer-events:none;max-width:88%;text-align:center;white-space:pre-line;line-height:1.4}
#toast.on{opacity:.96}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">

  <section id="s-price" class="screen">
    <div class="topbar">
      <h1>行情</h1>
      <button class="cropBtn" id="cropBtn">酪梨<span class="caret">▾</span></button>
      <div class="stamp" id="stamp">載入中…</div>
    </div>
    <div id="priceBody"></div>
  </section>

  <section id="s-detail" class="screen hide">
    <div class="topbar">
      <h1>每日明細</h1>
      <div class="stamp" id="stamp2"></div>
    </div>
    <div id="detailBody"></div>
  </section>

  <section id="s-setup" class="screen hide">
    <div class="topbar"><h1>設定</h1></div>
    <div id="setupBody"></div>
  </section>

  <nav id="tabs">
    <button data-go="s-price" aria-current="true">
      <svg viewBox="0 0 24 24"><path d="M3 17.5 9 11l4 4 8-8.5"/><path d="M21 6.5h-4.5M21 6.5V11"/></svg>
      行情
    </button>
    <button data-go="s-detail">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="1.4"/><circle cx="14" cy="12" r="1.4"/><circle cx="10" cy="19" r="1.4"/></svg>
      明細
    </button>
    <button data-go="s-setup">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>
      設定
    </button>
  </nav>
</div>

<div id="sheetHost"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
